# Rewrites the release body that `dist` generated from CHANGELOG.md.
#
# Two things need fixing, and both come from the same place: a changelog
# section is written to be read in a file, and a release body is rendered with
# GitHub Flavored Markdown.
#
#   * GFM turns a single newline into a line break, so the changelog's wrapped
#     paragraphs arrive as ragged columns of 79-character lines. Nobody writing
#     release notes by hand produces that.
#   * `dist` lifts out the version's section and leaves the `[#12]:` link
#     definitions at the foot of the file, so references render as literal
#     text.
#
# tools/release-notes.py fixes both. It runs here rather than at tag time so
# that the changelog stays the source of truth and nothing has to be remembered
# on the way out.

name: Release notes
on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string
permissions:
  contents: write

jobs:
  rewrite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Rewrite the release body
        env:
          GH_TOKEN: ${{ github.token }}
          PLAN: ${{ inputs.plan }}
        run: |
          set -euo pipefail
          tag=$(echo "$PLAN" | jq -r '.announcement_tag')
          version=${tag#v}
          echo "rewriting notes for $tag"
          python3 tools/release-notes.py "$version" > notes.md
          gh release edit "$tag" --notes-file notes.md

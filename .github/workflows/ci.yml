name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --all-targets --workspace
      # --all-targets skips doctests, and the crate docs carry runnable examples.
      - run: cargo test --doc --workspace

  lint:
    name: fmt and clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --workspace

  msrv:
    name: minimum supported rust version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace

  deny:
    name: supply chain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Security advisories, licences, duplicate versions and where each crate
      # came from. Configured in deny.toml, which says what each check is for.
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          # Vulnerabilities already fail on their own. This escalates the rest
          # — unmaintained and unsound notices, yanked versions, and an entry
          # in the allow list nothing uses any more — to match the -D warnings
          # the other jobs run under.
          #
          # The advisory database moves independently of this repository, so
          # this job can start failing on a tree that has not changed. That is
          # the point of it, and the escape hatch is an `ignore` entry in
          # deny.toml with a reason, not a weaker setting here.
          command-arguments: --deny warnings

  hooks:
    name: git hooks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v10
      # None of this is reachable from `cargo test`: the hook definitions, the
      # file selection and the script that fetches the binary all sit outside
      # the Rust build, so a break in them would otherwise reach a user before
      # it reached a maintainer.
      - run: shellcheck hooks/gdck tools/test-hooks.sh
      - run: cargo build -p gdck
      # Runs both `prek` and `pre-commit` against a sample project, and
      # separately proves the fetch path by downloading the newest release.
      - run: tools/test-hooks.sh

  corpus:
    name: corpus conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The reference implementation's test suite is the broadest corpus of real
      # GDScript available. Every file in it must round-trip through the tree.
      - name: Check out the reference corpus
        uses: actions/checkout@v5
        with:
          repository: Scony/godot-gdscript-toolkit
          path: corpus
      - name: Round-trip the corpus
        env:
          GDCK_CORPUS: corpus/tests
        run: cargo test -p gdck-syntax --test corpus -- --nocapture
      # Formatting every file with the safety checks on proves each one still
      # parses, means the same thing, kept its comments, and is stable.
      - name: Format the corpus
        env:
          GDCK_CORPUS: corpus/tests
        run: cargo test -p gdck-format --test corpus -- --nocapture
      # And the linter's fixes have to leave every one of them parseable,
      # settled, and no worse than they found it.
      - name: Lint the corpus
        env:
          GDCK_CORPUS: corpus/tests
        run: cargo test -p gdck-lint --test corpus -- --nocapture

  godot:
    name: godot conformance
    runs-on: ubuntu-latest
    env:
      # The newest stable release. Older ones accept a subset of the language,
      # so a case written against anything newer is skipped there rather than
      # checked — and a skip is indistinguishable from a pass in the summary.
      # Running the newest is what actually proves something. The note in
      # crates/gdck-format/tests/godot.rs says more.
      GODOT_VERSION: 4.7.1
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Godot
        run: |
          set -euo pipefail
          base=https://github.com/godotengine/godot-builds/releases/download
          name="Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          curl -sSfL "$base/${GODOT_VERSION}-stable/${name}.zip" -o godot.zip
          unzip -q godot.zip
          mv "$name" godot
          chmod +x godot
          # A binary that will not report its version is a broken download.
          # Failing here rather than below keeps that from being read as the
          # formatter having produced something Godot rejects.
          ./godot --headless --version
      - name: Check out the reference corpus
        uses: actions/checkout@v5
        with:
          repository: Scony/godot-gdscript-toolkit
          path: corpus
      # The other corpus checks re-parse formatted output with `gdck-syntax`,
      # which is lossless and lenient by design and so accepts things Godot
      # does not. This is the one that asks Godot.
      - name: Ask Godot to parse the formatted corpus
        env:
          GDCK_GODOT: ${{ github.workspace }}/godot
          GDCK_CORPUS: corpus/tests
        run: cargo test -p gdck-format --test godot -- --nocapture --test-threads=1

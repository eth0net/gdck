[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/eth0net/gdck"
homepage = "https://github.com/eth0net/gdck"
authors = ["eth0net"]

[workspace.dependencies]
gdck-config = { version = "0.1.0", path = "crates/gdck-config" }
gdck-format = { version = "0.1.0", path = "crates/gdck-format" }
gdck-lint = { version = "0.1.0", path = "crates/gdck-lint" }
gdck-syntax = { version = "0.1.0", path = "crates/gdck-syntax" }

anyhow = "1.0"
clap = { version = "4.5", features = ["derive", "wrap_help"] }

[workspace.lints.rust]
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# The parser does small numeric conversions constantly; these fire everywhere
# without catching anything real.
cast_possible_truncation = "allow"
# Fires on every prose mention of "GDScript", which is a language name and not
# an item to be set in backticks.
doc_markdown = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true

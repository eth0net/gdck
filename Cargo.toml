[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.3.0"
# Nothing is published unless it says so. A crate added to this workspace is an
# implementation detail until someone decides otherwise, and that decision is
# irreversible once made: a name on crates.io cannot be given back, and a
# version cannot be withdrawn. Opting in per crate keeps the default safe.
publish = false
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/eth0net/gdck"
homepage = "https://github.com/eth0net/gdck"
authors = ["eth0net"]

[workspace.dependencies]
# Path and version together. A build here resolves by path and ignores the
# version; `cargo publish` rewrites each of these to the version alone, since a
# path means nothing to anyone downloading the crate. Both have to be present
# for the two to work, and the versions move together with the workspace's.
gdck-config = { path = "crates/gdck-config", version = "0.3.0" }
gdck-format = { path = "crates/gdck-format", version = "0.3.0" }
gdck-lint = { path = "crates/gdck-lint", version = "0.3.0" }
gdck-syntax = { path = "crates/gdck-syntax", version = "0.3.0" }

anyhow = "1.0"
clap = { version = "4.5", features = ["derive", "wrap_help"] }
serde = { version = "1.0", features = ["derive"] }
similar = "3.1"
toml = "1.1"
yaml_serde = "0.10"

# Test-only. Cargo hands a test the path to the binary it built; what this adds
# is the failure message — the exit code, stdout and stderr of the run that went
# wrong, rather than `assertion failed: output.status.success()`.
assert_cmd = "2.0"

[workspace.lints.rust]
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# The parser does small numeric conversions constantly; these fire everywhere
# without catching anything real.
cast_possible_truncation = "allow"
# Fires on every prose mention of "GDScript", which is a language name and not
# an item to be set in backticks.
doc_markdown = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

# Prebuilt binaries and the installers that put them on a PATH, built by `dist`
# on every version tag. Most Godot developers have no Rust toolchain, so
# `cargo install` reaches a fraction of them; a downloaded archive is the
# fallback rather than the route.
#
# The installers earn their place twice over. A browser download is marked
# `com.apple.quarantine` on macOS and trips SmartScreen on Windows, where a
# script fetched with curl or irm is not — so they route around the prompt that
# would otherwise stop a first-time user. They also write the install receipt
# that a `gdck update` would read, which is why they come before it rather
# than instead of it.
[workspace.metadata.dist]
cargo-dist-version = "0.32.0"
ci = "github"
installers = ["shell", "powershell", "homebrew"]
# Written by the release, not by hand. `homebrew-core` would refuse a project
# this new — it asks for a notable and established one — and a tap needs no
# permission from anybody. Pushing to it needs a HOMEBREW_TAP_TOKEN secret on
# this repository, since the token a workflow gets by default cannot write to
# another one.
tap = "eth0net/homebrew-tap"
publish-jobs = ["homebrew"]
# Linux is built against musl and statically linked, which this dependency tree
# allows — no build scripts, nothing linking to C — so one binary runs on any
# distribution with no minimum glibc.
targets = [
    "aarch64-apple-darwin",
    "aarch64-unknown-linux-musl",
    "x86_64-apple-darwin",
    "x86_64-unknown-linux-musl",
    "x86_64-pc-windows-msvc",
]
# Not `CARGO_HOME`, which is the default and assumes the reader already has
# Rust. Someone installing this way is telling us they do not: `~/.cargo/bin`
# would likely not exist and would not be on their PATH. The installer adds
# this one if it is missing.
install-path = "~/.local/bin"
# The receipt is written either way, so `gdck update` can be added later as a
# subcommand without changing how anyone installed. `dist`'s own updater is a
# second binary beside the first, which is not the shape wanted here.
install-updater = false
